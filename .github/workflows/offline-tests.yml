name: Offline connector tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  redtiger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run Red Tiger synthetic tests
        run: python3 -m unittest discover -s providers/redtiger/tests -p 'test_*.py' -v

  belatra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run Belatra synthetic tests
        run: python3 -m unittest discover -s providers/belatra/tests -p 'test_*.py' -v
